<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>业绩预测数据清洗 - 天蝎座量化投资系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 30px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }

        .header h1 {
            font-size: 2rem;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .back-btn {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
            display: inline-block;
        }

        .back-btn:hover {
            background: #5568d3;
        }

        .info-banner {
            background: linear-gradient(135deg, #fff3e0 0%, #ffe0b2 100%);
            border-left: 4px solid #ff9800;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            display: flex;
            align-items: start;
        }

        .info-banner .icon {
            font-size: 24px;
            margin-right: 15px;
        }

        .info-banner .content {
            flex: 1;
        }

        .info-banner h3 {
            margin-bottom: 8px;
            color: #e65100;
            font-size: 16px;
        }

        .info-banner p {
            color: #f57c00;
            font-size: 14px;
            line-height: 1.6;
            margin: 4px 0;
        }

        .section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 1.3rem;
            margin-bottom: 20px;
            color: #333;
            display: flex;
            align-items: center;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 24px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            margin-right: 12px;
            border-radius: 2px;
        }

        .status-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .status-item {
            text-align: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .status-item .label {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }

        .status-item .value {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .progress-container {
            margin-top: 20px;
            display: none;
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: #e9ecef;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: bold;
        }

        .progress-info {
            margin-top: 15px;
            padding: 15px;
            background: white;
            border-radius: 8px;
            font-size: 14px;
            color: #666;
        }

        .progress-info .current-task {
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .log-container {
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
            background: #1e1e1e;
            border-radius: 8px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: #d4d4d4;
        }

        .log-entry {
            margin-bottom: 8px;
            line-height: 1.5;
        }

        .log-entry.success {
            color: #4caf50;
        }

        .log-entry.error {
            color: #f44336;
        }

        .log-entry.warning {
            color: #ff9800;
        }

        .log-entry.info {
            color: #2196f3;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 业绩预测数据清洗</h1>
            <a href="index.html" class="back-btn">← 返回首页</a>
        </div>

        <div class="info-banner">
            <div class="icon">⚠️</div>
            <div class="content">
                <h3>数据源说明</h3>
                <p>• 数据来源：AkShare - 同花顺业绩预测数据</p>
                <p>• 更新策略：每天每只股票只获取一次，自动覆盖更新（只保留最新预测）</p>
                <p>• 数据内容：营业收入、净利润、增长率、每股收益、ROE等预测指标（多年预测）</p>
                <p>• 用途：用于计算 PEG（市盈率相对盈利增长比率）和 PSG（市销率相对营收增长比率）</p>
            </div>
        </div>

        <!-- 更新状态 -->
        <div class="section">
            <h2 class="section-title">更新状态</h2>
            <div class="status-card">
                <div class="status-grid">
                    <div class="status-item">
                        <div class="label">更新日期</div>
                        <div class="value" id="statusDate">-</div>
                    </div>
                    <div class="status-item">
                        <div class="label">总股票数</div>
                        <div class="value" id="totalStocks">-</div>
                    </div>
                    <div class="status-item">
                        <div class="label">已更新</div>
                        <div class="value" id="updatedStocks">-</div>
                    </div>
                    <div class="status-item">
                        <div class="label">待更新</div>
                        <div class="value" id="remainingStocks">-</div>
                    </div>
                    <div class="status-item">
                        <div class="label">完成度</div>
                        <div class="value" id="progressPercent">-</div>
                    </div>
                </div>
                <div class="button-group" style="margin-top: 20px;">
                    <button class="btn btn-secondary" onclick="loadStatus()">
                        🔄 刷新状态
                    </button>
                </div>
            </div>
        </div>

        <!-- 数据清洗操作 -->
        <div class="section">
            <h2 class="section-title">数据清洗操作</h2>
            
            <div class="button-group">
                <button class="btn btn-primary" id="dailyUpdateBtn" onclick="startDailyUpdate()">
                    <span>📅 每日更新</span>
                </button>
            </div>

            <!-- 进度显示 -->
            <div class="progress-container" id="progressContainer">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill">0%</div>
                </div>
                <div class="progress-info">
                    <div class="current-task" id="currentTask">准备中...</div>
                    <div id="batchInfo">-</div>
                </div>
            </div>

            <!-- 日志显示 -->
            <div class="log-container" id="logContainer" style="display: none;"></div>
        </div>
    </div>

    <script>
        let isProcessing = false;

        // 页面加载时获取状态
        window.onload = function() {
            loadStatus();
        };

        // 加载更新状态
        function loadStatus() {
            fetch('/api/data-clean/profit-forecast/status')
                .then(response => response.json())
                .then(result => {
                    if (result.status === 'success') {
                        const data = result.data;
                        document.getElementById('statusDate').textContent = data.date;
                        document.getElementById('totalStocks').textContent = data.total_stocks;
                        document.getElementById('updatedStocks').textContent = data.updated_stocks;
                        document.getElementById('remainingStocks').textContent = data.remaining_stocks;
                        document.getElementById('progressPercent').textContent = data.progress_percent + '%';
                    }
                })
                .catch(error => {
                    console.error('获取状态失败:', error);
                    addLog('获取状态失败: ' + error.message, 'error');
                });
        }

        // 开始每日更新
        function startDailyUpdate() {
            if (isProcessing) {
                alert('正在处理中，请稍候...');
                return;
            }

            if (!confirm('确定要开始每日更新吗？\n\n将跳过今天已更新的股票，继续未完成的更新。\n每只股票的预测数据会被最新数据覆盖。')) {
                return;
            }

            startUpdate('/api/data-clean/profit-forecast/daily', {
                force_update: false
            });
        }

        // 开始更新
        function startUpdate(url, data) {
            isProcessing = true;
            
            // 禁用按钮
            document.getElementById('dailyUpdateBtn').disabled = true;
            
            // 显示进度条和日志
            document.getElementById('progressContainer').style.display = 'block';
            document.getElementById('logContainer').style.display = 'block';
            document.getElementById('logContainer').innerHTML = '';
            
            // 重置进度
            updateProgress(0, '准备中...', '-');
            
            addLog('开始数据清洗...', 'info');

            // 创建 EventSource 连接
            fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data)
            }).then(response => {
                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                function readStream() {
                    reader.read().then(({ done, value }) => {
                        if (done) {
                            finishUpdate();
                            return;
                        }

                        const text = decoder.decode(value);
                        const lines = text.split('\n');

                        lines.forEach(line => {
                            if (line.startsWith('data: ')) {
                                const jsonStr = line.substring(6);
                                try {
                                    const progressData = JSON.parse(jsonStr);
                                    handleProgressUpdate(progressData);
                                } catch (e) {
                                    console.error('解析进度数据失败:', e);
                                }
                            }
                        });

                        readStream();
                    });
                }

                readStream();
            }).catch(error => {
                addLog('请求失败: ' + error.message, 'error');
                finishUpdate();
            });
        }

        // 处理进度更新
        function handleProgressUpdate(data) {
            if (data.progress_percent !== undefined) {
                updateProgress(
                    data.progress_percent,
                    data.current_task || '处理中...',
                    data.batch_info || '-'
                );
            }

            if (data.current_task) {
                addLog(data.current_task, 'info');
            }

            if (data.error_message) {
                addLog(data.error_message, 'error');
            }

            if (data.status === 'completed') {
                addLog('✅ 数据清洗完成！', 'success');
                if (data.result) {
                    addLog(`统计: 保存 ${data.result.total_saved} 条, 跳过 ${data.result.skipped} 条, 失败 ${data.result.failed} 条`, 'info');
                }
                // 刷新状态
                setTimeout(loadStatus, 1000);
            }
        }

        // 更新进度条
        function updateProgress(percent, task, info) {
            const progressFill = document.getElementById('progressFill');
            progressFill.style.width = percent + '%';
            progressFill.textContent = percent + '%';
            
            document.getElementById('currentTask').textContent = task;
            document.getElementById('batchInfo').textContent = info;
        }

        // 添加日志
        function addLog(message, type = 'info') {
            const logContainer = document.getElementById('logContainer');
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry ${type}`;
            logEntry.textContent = `[${timestamp}] ${message}`;
            logContainer.appendChild(logEntry);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        // 完成更新
        function finishUpdate() {
            isProcessing = false;
            document.getElementById('dailyUpdateBtn').disabled = false;
        }
    </script>
</body>
</html>
